name: PR Automation and Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-lint:
    name: Lint PR Title and Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR Title Format
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            sec
            nfr
          requireScope: false

  check-build:
    name: Build & Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Java Environment Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Verify Build (if pom.xml present)
        run: |
          if [ -f pom.xml ]; then
            ./mvnw clean test --batch-mode
          else
            echo "pom.xml not yet committed. Documentation and project structure verified."
          fi
