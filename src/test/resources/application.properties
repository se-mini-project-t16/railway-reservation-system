# Test-only key to allow the Spring application context to start during automated tests.
# Never use this value outside the test environment.
app.jwt.secret=test-only-signing-key-not-for-production-1234567890
app.jwt.expiration-ms=900000
app.seed-demo-data=false
spring.datasource.url=jdbc:h2:mem:railwaytest;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Tests drive housekeeping directly
app.housekeeping.interval-ms=3600000
app.simulated-demand=false
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
