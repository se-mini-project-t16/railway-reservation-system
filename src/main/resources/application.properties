spring.application.name=railway-reservation-system
server.port=8080

# ===============================
# DATABASE CONFIGURATION (Default: H2 In-Memory)
# ===============================
spring.datasource.url=jdbc:h2:mem:railwaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.secret=${APP_JWT_SECRET:RailwayReservationSystemSuperSecretKeyWithAtLeast256BitsLengthForHS256Algorithm}
app.jwt.expiration-ms=900000

# ===============================
# LOGGING
# ===============================
logging.level.com.railway.reservation=INFO
logging.level.org.springframework.web=INFO

