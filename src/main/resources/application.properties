spring.application.name=railway-reservation-system
server.port=8080

# ===============================
# DATABASE CONFIGURATION (Default: H2 In-Memory)
# ===============================
spring.datasource.url=jdbc:h2:mem:railwaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.secret=${APP_JWT_SECRET:RailwayReservationSystemSuperSecretKeyWithAtLeast256BitsLengthForHS256Algorithm}
# 15-minute inactivity timeout (RRS-SR-005); each authenticated request renews the token
app.jwt.expiration-ms=900000

# ===============================
# LOGIN LOCKOUT CONFIGURATION
# ===============================
app.auth.max-failed-attempts=5
app.auth.lock-duration-minutes=15

# ===============================
# ADMIN SEED USER
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@railway.gov.in}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ===============================
# DEMO DATA SEEDING
# ===============================
app.seed-demo-data=true

# ===============================
# PAYMENT GATEWAY (RRS-F-008, TC-PAY-01)
# ===============================
app.payment.gateway-url=${PAYMENT_GATEWAY_URL:}
app.payment.sandbox-enabled=true
app.payment.mock-fallback=true

# ===============================
# LOGGING & OPERATIONAL RELIABILITY (RRS-NF-002, RRS-NF-005, SAD Section 4.4)
# ===============================
logging.file.name=logs/railway-reservation.log
logging.logback.rollingpolicy.file-name-pattern=logs/railway-reservation-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7
logging.level.com.railway.reservation=INFO
logging.level.org.springframework.web=INFO


