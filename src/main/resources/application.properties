spring.application.name=railway-reservation-system
server.port=8080

# ===============================
# DATABASE CONFIGURATION (Default: H2 file database in ./data)
# ===============================
# File database: bookings survive restarts. AUTO_SERVER lets DBeaver open it while the app runs.
# Set DB_URL=jdbc:h2:mem:railwaydb for a throwaway in-memory database.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/railwaydb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console at http://localhost:8080/h2-console (off unless H2_CONSOLE=true)
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.secret=${APP_JWT_SECRET:RailwayReservationSystemSuperSecretKeyWithAtLeast256BitsLengthForHS256Algorithm}
# 15-minute inactivity timeout (RRS-SR-005); each authenticated request renews the token
app.jwt.expiration-ms=900000

# ===============================
# LOGIN LOCKOUT CONFIGURATION
# ===============================
app.auth.max-failed-attempts=5
app.auth.lock-duration-minutes=15

# ===============================
# ADMIN SEED USER
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@railway.gov.in}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ===============================
# REFERENCE DATA (stations and timetable; skipped once stations exist)
# ===============================
app.seed-demo-data=true

# Background jobs: release lapsed payment holds, cancel waitlisted tickets after chart preparation
app.housekeeping.interval-ms=30000

# ===============================
# LOGGING & OPERATIONAL RELIABILITY (RRS-NF-002, RRS-NF-005, SAD Section 4.4)
# ===============================
logging.file.name=logs/railway-reservation.log
logging.logback.rollingpolicy.file-name-pattern=logs/railway-reservation-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7
logging.level.com.railway.reservation=INFO
logging.level.org.springframework.web=INFO


