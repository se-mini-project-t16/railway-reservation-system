<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station board | Railway Reservation System</title>
  <meta name="description" content="Every scheduled departure from a station on a chosen day.">
  <script src="/js/theme-init.js"></script>
  <link rel="preload" href="/fonts/chivo-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/pages/station.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="container"><a class="wordmark" href="/">Railway Reservation</a></div></header>
  <main id="main">
    <div class="container page">
      <div class="page-head">
        <div>
          <h1 id="st-title">Station board</h1>
          <p id="st-sub">Scheduled departures from the timetable.</p>
        </div>
        <form id="st-form" class="toolbar" novalidate>
          <div class="field"><label for="from">Station</label><input class="input" id="from" name="code" placeholder="Station or code"><span class="help"></span></div>
          <div class="field"><label for="st-date">Date</label><input class="input" type="date" id="st-date" name="date"><span class="help"></span></div>
          <button class="btn btn--primary" type="submit">Show departures</button>
        </form>
      </div>
    </div>
    <section class="band--ink home-board" aria-labelledby="st-title">
      <div class="container" id="st-board" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
