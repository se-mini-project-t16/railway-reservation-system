<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNR status | Railway Reservation System</title>
  <meta name="description" content="Check the booking and current status of every traveller on a PNR.">
  <script src="/js/theme-init.js"></script>
  <link rel="preload" href="/fonts/chivo-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/pages/pnr.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="container"><a class="wordmark" href="/">Railway Reservation</a></div></header>
  <main id="main" class="container page">
    <div class="page-head">
      <div>
        <h1>PNR status</h1>
        <p>Booking and current status for each traveller. Names stay private.</p>
      </div>
    </div>
    <form id="pnr-form" class="pnr-strip" action="/pnr.html" method="get" novalidate>
      <div class="field">
        <label for="pnr">PNR number</label>
        <input class="input input--lg" id="pnr" name="pnr" inputmode="numeric" autocomplete="off" maxlength="12" required aria-describedby="pnr-help">
        <span class="help" id="pnr-help" data-hint="The 10 digits on your ticket.">The 10 digits on your ticket.</span>
      </div>
      <button class="btn btn--primary btn--lg" type="submit">Check status</button>
    </form>
    <div id="pnr-result" aria-live="polite"></div>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
