<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stations | Operations console</title>
  <meta name="description" content="The stations trains can call at.">
  <script src="/js/theme-init.js"></script>
  <link rel="preload" href="/fonts/chivo-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/admin/stations.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="admin-bar"></header>
  <nav class="admin-tabs" aria-label="Console"></nav>
  <main id="main" class="container page">
    <div class="page-head"><div><h1>Stations</h1><p>Add a station before using it on a route.</p></div></div>
    <div class="admin-grid">
      <div id="list" aria-live="polite"><div class="skeleton-row"></div></div>
      <form class="panel stack" id="sf" novalidate aria-labelledby="sf-title">
        <h2 id="sf-title">Add a station</h2>
        <div class="field"><label for="s-code">Code</label><input class="input" id="s-code" name="code" maxlength="5" autocomplete="off" aria-describedby="s-code-help"><span class="help" id="s-code-help" data-hint="2 to 5 capital letters, such as MAS.">2 to 5 capital letters, such as MAS.</span></div>
        <div class="field"><label for="s-name">Name</label><input class="input" id="s-name" name="name" maxlength="80" aria-describedby="s-name-help"><span class="help" id="s-name-help"></span></div>
        <div class="field"><label for="s-city">City</label><input class="input" id="s-city" name="city" maxlength="60" aria-describedby="s-city-help"><span class="help" id="s-city-help"></span></div>
        <div class="field"><label for="s-state">State</label><input class="input" id="s-state" name="state" maxlength="40" aria-describedby="s-state-help"><span class="help" id="s-state-help"></span></div>
        <div id="s-msg" role="status"></div>
        <button class="btn btn--primary" type="submit">Add station</button>
      </form>
    </div>
  </main>
</body>
</html>
