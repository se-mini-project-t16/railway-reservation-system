# Copy this file to ../railway-secrets.properties (the folder that contains the project),
# fill in your own values and never commit the copy. The app reads it on start.

# Google sign-in: OAuth 2.0 Client ID (Web application) from Google Cloud Console.
# Add http://localhost:8080 and your public address under Authorized JavaScript origins.
app.google.client-id=

# Email for sign-up verification codes: the Gmail address that owns the app password, and the
# app password itself (Google Account > Security > 2-Step Verification > App passwords).
# Not your normal password. Addresses that only forward mail (such as Cloudflare Email Routing)
# cannot sign in to Gmail's SMTP server.
spring.mail.username=
spring.mail.password=

# Razorpay API keys (Dashboard > Account & Settings > API Keys). Test keys start with rzp_test_
# and move no real money.
app.razorpay.key-id=
app.razorpay.key-secret=
